<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexend the Web</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <div class="wordmark" aria-label="Lexend the Web">
          <span class="wordmark-mark" aria-hidden="true">L</span>
          <span>LEXEND THE WEB</span>
        </div>
        <label class="master-control">
          <span id="master-state">On</span>
          <input id="enabled" type="checkbox" aria-label="Turn Lexend off" />
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </header>

      <section id="site-strip" class="site-strip" aria-label="Current site" hidden>
        <p id="site-status-text"></p>
        <button id="toggle-site" class="text-link" type="button">Pause here</button>
      </section>

      <fieldset id="scope-fieldset" class="popup-section scope-section">
        <legend>Apply Lexend to</legend>
        <label class="choice-card">
          <input type="radio" name="scope" value="body" />
          <span class="radio-mark" aria-hidden="true"></span>
          <span class="choice-copy">
            <strong>Body text:</strong>
            <span>Paragraphs, links, labels, controls</span>
          </span>
        </label>
        <label class="choice-card">
          <input type="radio" name="scope" value="all" />
          <span class="radio-mark" aria-hidden="true"></span>
          <span class="choice-copy">
            <strong>Body and headings:</strong>
            <span>Everything above, plus H1 to H6</span>
          </span>
        </label>
      </fieldset>

      <fieldset id="spacing-fieldset" class="popup-section spacing-section">
        <legend>Spacing</legend>
        <div class="segments" aria-label="Letter spacing">
          <label>
            <input type="radio" name="spacing" value="0" />
            <span>Default</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.04" />
            <span>Wide</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.08" />
            <span>Wider</span>
          </label>
        </div>
        <p id="spacing-preview" class="spacing-preview">
          The quick brown fox jumps over the lazy dog.
        </p>
      </fieldset>

      <aside id="restricted-note" class="restricted-note" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
          <path d="M7 10V7a5 5 0 0 1 10 0v3h2v11H5V10h2Zm2 0h6V7a3 3 0 0 0-6 0v3Zm-2 2v7h10v-7H7Z" fill="currentColor" />
        </svg>
        <p>Browser pages like settings and new tab can't be changed by extensions.</p>
      </aside>

      <footer>
        <div class="footer-links">
          <button id="export-settings" class="footer-link" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V3ZM5 19h14v2H5v-2Z" /></svg>
            Export settings
          </button>
          <button id="import-settings" class="footer-link" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 21h2V10.8l3.6 3.6L18 13l-6-6-6 6 1.4 1.4 3.6-3.6V21ZM5 3h14v2H5V3Z" /></svg>
            Import settings
          </button>
          <button id="reset-settings" class="footer-link danger-link" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 4.9l1.9.8A6 6 0 1 0 8.2 7L11 9.8V3H4.2l2.5 2.5A8 8 0 0 1 12 4Z" /></svg>
            <span>Reset</span>
          </button>
          <button id="open-options" class="footer-link" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h6v2H7v10h10v-4h2v6H5V5Zm8-2h8v8h-2V6.4l-6.3 6.3-1.4-1.4L17.6 5H13V3Z" /></svg>
            Open all settings
          </button>
        </div>
        <p id="popup-feedback" class="popup-feedback" role="status" aria-live="polite"></p>
      </footer>
    </main>
    <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" />
    <script src="src/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
