<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexend for the Web</title>
    <script src="src/ui-theme.js"></script>
    <link rel="preload" href="assets/fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="src/diagnostics.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <div class="masthead-leading">
          <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" title="Settings">
            <svg aria-hidden="true" viewBox="1 0 24 24">
              <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L15 3.3h-4L10.7 6a8 8 0 0 0-1.7 1L6.5 6l-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4L9 17a8 8 0 0 0 1.7 1l.3 2.7h4l.3-2.7a8 8 0 0 0 1.7-1l2.5 1 2-3.4-2.1-1.6ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
            </svg>
          </button>
          <a
            class="wordmark lexend-wordmark"
            href="https://www.lexend.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit the Lexend website"
          >
            <span class="wordmark-lexend lxnd-word" aria-hidden="true">
              <span class="lxnd-letter">L</span>
              <span class="lxnd-letter lxnd-letter-insert">E</span>
              <span class="lxnd-letter">X</span>
              <span class="lxnd-letter lxnd-letter-insert">E</span>
              <span class="lxnd-letter">N</span>
              <span class="lxnd-letter">D</span>
            </span>
          </a>
        </div>
        <label class="master-control ui-switch">
          <span class="visually-hidden">Global Lexend </span><span id="master-state">On</span>
          <input id="enabled" type="checkbox" aria-label="Turn Lexend off" />
          <span class="switch-track ui-switch-track" aria-hidden="true">
            <span class="switch-thumb ui-switch-thumb"></span>
          </span>
        </label>
      </header>

      <p id="popup-feedback" class="popup-feedback" role="status" aria-live="polite"></p>
      <button id="retry-save" class="text-link" type="button" hidden>Retry unsaved changes</button>
      <button id="retry-page" class="text-link" type="button" hidden>Check page again</button>
      <button id="retry-load" class="text-link" type="button" hidden>Retry loading settings</button>

      <section id="site-strip" class="site-strip" aria-label="Current site" hidden>
        <div class="site-strip-copy">
          <p id="site-status-text"></p>
          <p id="site-message" class="site-message"></p>
          <label class="site-layout-control"><input id="site-layout-repair" type="checkbox" aria-describedby="site-layout-repair-help" /> <span>Layout repair on this site</span></label>
          <p id="site-layout-repair-help" class="site-message">Adjust containers to fit enlarged text.</p>
          <button id="use-inherited-site" class="text-link" type="button" hidden>Use inherited site settings</button>
          <details class="site-details">
            <summary>Setting sources</summary>
            <p id="site-sources" class="site-message"></p>
          </details>
        </div>
        <button id="toggle-site" class="site-action" type="button">Pause here</button>
      </section>

      <fieldset id="scope-fieldset" class="popup-section scope-section">
        <legend class="section-label">Global scope</legend>
        <label class="choice-card">
          <input type="radio" name="scope" value="body" />
          <span class="choice-copy">
            <strong>Body text</strong>
            <span>Paragraphs, links, labels, controls</span>
          </span>
          <span class="choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" /></svg></span>
        </label>
        <label class="choice-card">
          <input type="radio" name="scope" value="all" />
          <span class="choice-copy">
            <strong>Body and headings</strong>
            <span>Include page titles and section headings</span>
          </span>
          <span class="choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" /></svg></span>
        </label>
      </fieldset>

      <fieldset id="spacing-fieldset" class="popup-section spacing-section">
        <legend class="section-label">Global spacing</legend>
        <div class="segments" aria-label="Letter spacing">
          <label>
            <input type="radio" name="spacing" value="0" />
            <span>Default</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.04" />
            <span>Comfortable</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.08" />
            <span>Spacious</span>
          </label>
          <label id="spacing-custom-choice" class="custom-choice" hidden>
            <input id="spacing-custom" type="radio" name="spacing" value="custom" data-custom="true" />
            <span id="spacing-custom-label">Custom</span>
          </label>
        </div>
        <button id="adjust-custom-spacing" class="text-link" type="button" hidden>Adjust custom spacing in settings</button>
        <figure id="quote-preview" class="spacing-preview">
          <blockquote id="spacing-preview-text" lang="de" tabindex="0">“Zu sagen, was ist, bleibt die revolutionärste Tat.”</blockquote>
          <figcaption class="quote-footer">
            <span>— <a id="quote-author" href="https://en.wikipedia.org/wiki/Rosa_Luxemburg" target="_blank" rel="noopener noreferrer">Rosa Luxemburg</a></span>
          </figcaption>
        </figure>
      </fieldset>

      <aside id="restricted-note" class="restricted-note" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
          <path d="M7 10V7a5 5 0 0 1 10 0v3h2v11H5V10h2Zm2 0h6V7a3 3 0 0 0-6 0v3Zm-2 2v7h10v-7H7Z" fill="currentColor" />
        </svg>
        <p>Browser pages like settings and new tab can't be changed by extensions.</p>
      </aside>

      <section class="popup-diagnostics" aria-label="Diagnostics">
        <button type="button" class="text-link" id="popup-export-diagnostics" data-diagnostics-export data-diagnostics-status="popup-diagnostics-status" aria-describedby="popup-diagnostics-help">Save diagnostics</button>
        <p id="popup-diagnostics-help">Local report; excludes website addresses, site rules, and page text. Nothing is sent.</p>
        <p id="popup-diagnostics-status" role="status" aria-live="polite"></p>
      </section>

    </main>
    <script src="src/settings.js"></script>
    <script src="src/preferences.js"></script>
    <script src="src/save-recovery.js"></script>
    <script src="src/quotes.js"></script>
    <script src="src/diagnostics.js"></script>
    <script src="src/diagnostics-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
