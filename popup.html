<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexend for the Web</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <div class="wordmark" aria-label="Lexend for the Web">
          <span class="wordmark-mark" aria-hidden="true">L</span>
          <span>Lexend for the Web</span>
        </div>
        <div class="masthead-actions">
          <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" title="Settings">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L15 3.3h-4L10.7 6a8 8 0 0 0-1.7 1L6.5 6l-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4L9 17a8 8 0 0 0 1.7 1l.3 2.7h4l.3-2.7a8 8 0 0 0 1.7-1l2.5 1 2-3.4-2.1-1.6ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
            </svg>
          </button>
          <label class="master-control">
            <span id="master-state">On</span>
            <input id="enabled" type="checkbox" aria-label="Turn Lexend off" />
            <span class="switch-track" aria-hidden="true">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>
      </header>

      <section id="site-strip" class="site-strip" aria-label="Current site" hidden>
        <p id="site-status-text"></p>
        <button id="toggle-site" class="text-link" type="button">Pause here</button>
      </section>

      <fieldset id="scope-fieldset" class="popup-section scope-section">
        <legend>Apply Lexend to</legend>
        <label class="choice-card">
          <input type="radio" name="scope" value="body" />
          <span class="radio-mark" aria-hidden="true"></span>
          <span class="choice-copy">
            <strong>Body text:</strong>
            <span>Paragraphs, links, labels, controls</span>
          </span>
        </label>
        <label class="choice-card">
          <input type="radio" name="scope" value="all" />
          <span class="radio-mark" aria-hidden="true"></span>
          <span class="choice-copy">
            <strong>Body and headings:</strong>
            <span>Everything above, plus H1 to H6</span>
          </span>
        </label>
      </fieldset>

      <fieldset id="spacing-fieldset" class="popup-section spacing-section">
        <legend>Spacing</legend>
        <div class="segments" aria-label="Letter spacing">
          <label>
            <input type="radio" name="spacing" value="0" />
            <span>Compact</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.04" />
            <span>Comfortable</span>
          </label>
          <label>
            <input type="radio" name="spacing" value="0.08" />
            <span>Spacious</span>
          </label>
        </div>
        <figure id="quote-preview" class="spacing-preview">
          <blockquote id="spacing-preview-text" lang="de" tabindex="0">“Zu sagen, was ist, bleibt die revolutionärste Tat.”</blockquote>
          <figcaption class="quote-footer">
            <span>— <a id="quote-author" href="https://en.wikipedia.org/wiki/Rosa_Luxemburg" target="_blank" rel="noopener noreferrer">Rosa Luxemburg</a></span>
          </figcaption>
        </figure>
      </fieldset>

      <aside id="restricted-note" class="restricted-note" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
          <path d="M7 10V7a5 5 0 0 1 10 0v3h2v11H5V10h2Zm2 0h6V7a3 3 0 0 0-6 0v3Zm-2 2v7h10v-7H7Z" fill="currentColor" />
        </svg>
        <p>Browser pages like settings and new tab can't be changed by extensions.</p>
      </aside>

      <div class="attribution">
        <a href="https://costeer.dev" target="_blank" rel="noopener noreferrer">
          <span
            >made with
            <span class="attribution-mark" aria-hidden="true">
              <span class="attribution-heart">♥</span>
              <span class="attribution-hover-mark">☭</span>
            </span>
            by costeer</span
          >
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h6v2H7v10h10v-4h2v6H5V5Zm8-2h8v8h-2V6.4l-6.3 6.3-1.4-1.4L17.6 5H13V3Z" /></svg>
        </a>
        <p id="popup-feedback" class="popup-feedback" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script src="src/settings.js"></script>
    <script src="src/quotes.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
