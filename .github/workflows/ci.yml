name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package
      - run: npm run lint:firefox
      - uses: actions/upload-artifact@v6
        with:
          name: browser-packages
          path: dist/releases/*.zip
          if-no-files-found: error
