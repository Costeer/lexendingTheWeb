name: Empirical performance gate

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
      artifact-name:
        type: string
        default: performance-regressions

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select a baseline predating the changes
        id: baseline
        env:
          PERFORMANCE_BASE: ${{ inputs.base }}
        run: |
          test -n "$PERFORMANCE_BASE"
          PERFORMANCE_COMMIT=$(git rev-parse --verify --end-of-options "$PERFORMANCE_BASE^{commit}")
          echo "commit=$PERFORMANCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Compare runtime performance
        env:
          PERFORMANCE_BASE: ${{ steps.baseline.outputs.commit }}
        run: npm run test:performance -- --base "$PERFORMANCE_BASE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/performance/
          if-no-files-found: error
