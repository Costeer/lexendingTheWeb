name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installed-browsers:
    uses: ./.github/workflows/installed-browsers.yml
    with:
      artifact-prefix: release-browser-${{ github.sha }}

  performance:
    uses: ./.github/workflows/performance.yml
    with:
      release-tag: ${{ github.ref_name }}
      artifact-name: release-performance-${{ github.sha }}

  interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-interface-regressions
          path: |
            dist/ui-tests/results/
            dist/ui-tests/report/
          if-no-files-found: error

  release:
    needs: [interfaces, performance, installed-browsers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - name: Verify tag and package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm run check
      - run: npm run package
      - run: npm run test:packages
      - run: npm run lint:firefox
      - uses: actions/download-artifact@v6
        with:
          name: release-performance-${{ github.sha }}
          path: dist/performance/
      - name: Verify performance evidence before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-performance.mjs verify --tag "$RELEASE_TAG" --report dist/performance/report.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/*.zip --generate-notes --verify-tag
