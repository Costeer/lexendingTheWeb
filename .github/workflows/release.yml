name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - name: Verify tag and package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm run check
      - run: npm run package
      - run: npm run lint:firefox
      - name: Test installed Chrome and Firefox extensions
        env:
          SE_AVOID_STATS: "true"
          SE_FORCE_BROWSER_DOWNLOAD: "true"
        run: |
          npm run test:browser -- chrome
          npm run test:browser -- firefox
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/*.zip --generate-notes --verify-tag
